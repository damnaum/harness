name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit + integration tests (offline, no keys)
        run: python -m unittest discover -s tests -v
      - name: Byte-compile every module
        run: python -m compileall -q apex tests examples
      - name: Build and install the distribution (catches broken packaging)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation --force-reinstall .
          cd /tmp && apex --version
      - name: Eval suite regression gate (fails below 95% pass)
        run: python -m apex --profile offline eval --min-pass-rate 0.95
      - name: CLI smoke test
        run: |
          python -m apex doctor > /dev/null
          python -m apex models > /dev/null
          python -m apex --profile offline run "What is 12 * 12?" | grep -q 144
